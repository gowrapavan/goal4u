<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0035be" />
    <!-- fonts load without blocking the first paint (they swap in); team crests and video thumbnails get their connections opened early -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" /></noscript>
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="icon" href="/logo/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/logo/site.webmanifest" />
    <meta name="application-name" content="Goal4U" />
    <meta name="apple-mobile-web-app-title" content="Goal4U" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>try{var t=localStorage.getItem("g4u-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>Goal4U | Live Football Scores & Stats</title>
    <meta name="description" content="Goal4U provides live football scores, comprehensive match statistics, latest news, and highlights for Premier League, Champions League, La Liga, and more." />
    <style>
      /* the crawlable text is in the HTML for search engines; it stays out of sight (still readable by screen readers) until the app takes over, so there is no flash of unstyled text on a slow connection */
      #root>main[data-seo-fallback]{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
      html[data-theme="dark"] body{background:#0b0f1a}
      #root:has(>main[data-seo-fallback]:only-child)::after{content:"";position:fixed;top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid rgba(0,53,190,.2);border-top-color:#0035be;border-radius:50%;animation:g4uspin .8s linear infinite}
      @keyframes g4uspin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
